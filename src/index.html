<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Angular Component Library for Standalone Apps | Hub UI</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Text fonts are self-hosted (see src/styles/fonts.scss). Preconnect stays for the
		     Material Symbols icon set, which still loads from Google Fonts via styles.scss. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Preload the display font used by the above-the-fold H1 to cut LCP/CLS. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="/fonts/google/xMQ9uFFYT72X5wkB_18qmnndmSdSnh2BAfO5mnuyOo1lfiQwV6-xo6eeIw.woff2"
		/>
		<meta
			name="description"
			content="Reusable Angular UI components with standalone support, Angular Signals-friendly APIs, CSS variables, accessibility, examples and NPM packages for modals, tables, navigation, calendar and more."
		/>
		<!-- The static shell defaults to noindex: every REAL route rewrites this tag
		     (SeoService) during prerender/SSR, so only raw-shell responses (404s and
		     unprerendered paths) keep it. Prevents unknown URLs from presenting
		     themselves as indexable copies of the homepage. -->
		<meta name="robots" content="noindex,follow" />
		<meta property="og:site_name" content="Hub UI" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Angular Component Library for Standalone Apps | Hub UI" />
		<meta
			property="og:description"
			content="Reusable Angular UI components with standalone support, Angular Signals-friendly APIs, CSS variables, accessibility, examples and NPM packages for modals, tables, navigation, calendar and more."
		/>
		<meta property="og:image" content="https://hubui.dev/og-image.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Angular Component Library for Standalone Apps | Hub UI" />
		<meta
			name="twitter:description"
			content="Reusable Angular UI components with standalone support, Angular Signals-friendly APIs, CSS variables, accessibility, examples and NPM packages for modals, tables, navigation, calendar and more."
		/>
		<meta name="twitter:image" content="https://hubui.dev/og-image.png" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
		<link rel="manifest" href="manifest.webmanifest" />
	</head>
	<body>
		<app-root></app-root>
	</body>
</html>
